  { re:/skatteverket/i, hoppa:"Skatteinbetalning (preliminärskatt/moms) – ingen kostnad" },
  { re:/first\s*card|eurocard|amex|american\s*express|kortfaktura|kreditkort/i, hoppa:"Betalning av kortfaktura – bokför köpen från kortets kontoutdrag" },
  { re:/lunar\s*bank/i, hoppa:"Överföring mellan egna konton" },
  { re:/avgifter\s*nordea|nordea\s*avgift|kontoavgift|plusgiro\s*avgift/i, konto:"6570", moms:0 },
  { re:/hi3g|^3\s*\(|telia|tele2|telenor|hallon|comviq/i, konto:"6212", moms:25 },
  { re:/platform\s*gallery|canada\s*inc|lokalhyra|kontorshyra/i, konto:"5010", moms:25 },
  { re:/^sl$|storstockholms\s*lokal|västtrafik|skånetrafiken|^sj\b|ul\s*resor/i, konto:"5810", moms:6 },
  { re:/lunar\s*plan|^avgift$|bankavgift|årsavgift\s*kort|valutaavgift/i, konto:"6570", moms:0 },
  { re:/anthropic|claude/i, konto:"6540", moms:25, omvand:"eu", not:"Anthropic Ireland" },
  { re:/openai|chatgpt/i, konto:"6540", moms:25, omvand:"eu", not:"OpenAI Ireland" },
  { re:/figma/i, konto:"6540", moms:25, omvand:"ej-eu", not:"Figma Inc (USA)" },
  { re:/webflow/i, konto:"6540", moms:25, omvand:"ej-eu", not:"Webflow Inc (USA)" },
  { re:/canva/i, konto:"6540", moms:25, omvand:"ej-eu", not:"Canva Pty (Australien)" },
  { re:/airtable/i, konto:"6540", moms:25, omvand:"ej-eu", not:"Airtable (USA)" },
  { re:/lastpass/i, konto:"6540", moms:25, omvand:"ej-eu", not:"LastPass (USA)" },
  { re:/paddle\.net|aragon/i, konto:"6540", moms:25, omvand:"ej-eu", not:"Paddle (Storbritannien)" },
  { re:/feedspring/i, konto:"6540", moms:25, omvand:"ej-eu" },
  { re:/strato/i, konto:"6230", moms:25, omvand:"eu", not:"Strato AG (Tyskland)" },
  { re:/one\.com|loopia|binero|glesys/i, konto:"6230", moms:25 },
  { re:/youtube|google|wl\*google/i, konto:"6540", moms:25 },
  { re:/^apple|itunes|app\s*store/i, konto:"6540", moms:25 },
  { re:/visma|spiris|fortnox|bokio/i, konto:"6540", moms:25 },
  { re:/telia|tele2|telenor|^tre\b|hallon|comviq/i, konto:"6212", moms:25 },
  { re:/webhallen|netonnet|elgiganten|inet|komplett|clas\s*ohlson|clasohlson|kjell|nudient|ikea|biltema|jula/i, konto:"5400", moms:25 },
  { re:/circle\s*k|preem|okq8|st1|ingo|shell|mark-service|tanka/i, konto:"5611", moms:25 },
  { re:/staples|lyreco|office\s*depot/i, konto:"6110", moms:25 },
  { re:/linkedin|meta\s*ads|facebk|google\s*ads/i, konto:"5910", moms:25 },
];
function levNyckel(text){ return String(text||"").toLowerCase().replace(/[0-9*#.\-_/]+/g," ").replace(/\s+/g," ").trim(); }
function bankForslag(text, bel, historik, heltext){
  const regelText=heltext||text||"";
  const kostnadsKonto=k=>KONTON.kostnad.find(x=>x.konto===k);
  const h=historik[levNyckel(text)];
  if(h && !LEV_REGLER.some(x=>x.hoppa && x.re.test(regelText))) return Object.assign({ inc:true, kalla:"tidigare" }, h, bel>0&&h.typ==="kostnad"?{ not:"Återbetalning · som tidigare" }:{});
  // Överföringar/uttag kollas mot hela raden (t.ex. Nordeas meddelandefält), övriga regler mot texten först
  const r=LEV_REGLER.find(x=>x.hoppa && x.re.test(regelText)) || LEV_REGLER.find(x=>!x.hoppa && x.re.test(text||"")) || LEV_REGLER.find(x=>!x.hoppa && x.re.test(regelText));
  if(r && r.hoppa) return { inc:false, typ:bel<0?"kostnad":"intakt", konto:bel<0?"6991":"3001", moms:0, omvand:"", not:r.hoppa, kalla:"regel" };
  if(r){ const k=kostnadsKonto(r.konto)||{konto:r.konto,namn:r.konto};
    // Positivt belopp från en känd leverantör = återbetalning, minskar kostnaden
    return { inc:true, typ:"kostnad", konto:k.konto, moms:r.moms, omvand:r.omvand||"", not:(bel>0?"Återbetalning":"")+(r.not?(bel>0?" · ":"")+r.not:""), kalla:"regel" };
  }
  return bel<0 ? { inc:true, typ:"kostnad", konto:"6991", moms:25, omvand:"", not:"", kalla:"" }
               : { inc:true, typ:"intakt", konto:"3001", moms:25, omvand:"", not:"", kalla:"" };
}
function bankHistorik(){
  const h={};
  co().trans.slice().sort((a,b)=>a.datum<b.datum?-1:1).forEach(t=>{
    if(!t.beskrivning || t.fromFaktura) return;
    h[levNyckel(t.beskrivning)]={ typ:t.typ, konto:t.konto, moms:Number(t.momssats)||0, omvand:t.omvand||"", not:"Som tidigare" };
  });
  return h;
}

/* ---- Zip (t.ex. Lunars export med kvitton i Appendix/<datum>/<transaktions-id>/) ---- */
let _zipP=null;
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  if(_zipP) return _zipP;
  _zipP=new Promise((res,rej)=>{
    const sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    sc.onload=()=>res(window.JSZip);
    sc.onerror=()=>{ _zipP=null; rej(new Error("Kunde inte ladda zip-läsaren (kräver internet).")); };
    document.head.appendChild(sc);
  });
  return _zipP;
}
const MIME={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif",heic:"image/heic"};
async function lasZip(file){
  const JSZip=await loadJSZip();
  const zip=await JSZip.loadAsync(file);
  const out={ csv:[], kvitton:[] };
  for(const path of Object.keys(zip.files)){
    const e=zip.files[path]; if(e.dir || /(^|\/)(__MACOSX|\.)/.test(path)) continue;
    const ext=(path.split(".").pop()||"").toLowerCase(), parts=path.split("/");
    if(ext==="csv"||ext==="txt"){ out.csv.push({ name:parts[parts.length-1], text:decodeFile(await e.async("arraybuffer")) }); continue; }
    if(!MIME[ext] || parts.length<2) continue; // filer i roten (t.ex. kontoutdraget) är inga kvitton
    const blob=await e.async("blob");
    out.kvitton.push({ nyckel:(parts.length>1?parts[parts.length-2]:"").toLowerCase(), name:parts[parts.length-1],
      file:new File([blob], parts[parts.length-1], { type:MIME[ext] }) });
  }
  return out;
}
// Kopplar kvitton från zip till verifikationer med samma bank-ID. Returnerar {kopplade, ejMatchade}
async function kopplaZipKvitton(kvitton, status){
  const perId={}; co().trans.forEach(t=>{ if(t.bankId) perId[String(t.bankId).toLowerCase()]=t; });
  let kopplade=0; const ejMatchade=[];
  for(let i=0;i<kvitton.length;i++){
    const k=kvitton[i], t=perId[k.nyckel];
    if(!t){ ejMatchade.push(k); continue; }
    if(status) status(`Sparar kvitto ${i+1} av ${kvitton.length}…`);
    try{
      const p=await processKvitto(k.file);
      // hoppa över om exakt samma fil redan finns
      let finns=false; for(const id of kvittoIds(t)){ const r=await Kvitton.get(id); if(r && r.dataUrl===p.dataUrl){ finns=true; break; } }
      if(!finns){ await laggTillKvitto(t, p); kopplade++; }
    }catch(e){ ejMatchade.push(k); }
  }
  return { kopplade, ejMatchade };
}

function openImport(){
  const root=document.getElementById("modal");
  let rows=[], zipKvitton=[];
  const $=id=>document.getElementById(id);
  const close=()=>root.innerHTML="";

  root.innerHTML=`
   <div class="modal-bg" id="impbg"><div class="modal" style="max-width:1040px">
     <div class="modal-head"><div class="serif" style="font-size:22px">Importera bank-CSV</div>
       <button class="x" id="imp-close">✕</button></div>
     <div id="imp-body">
       <p class="note" style="margin-top:0">Exportera dina transaktioner som CSV-fil från din internetbank och välj filen här, eller klistra in raderna nedan.
         Har banken en zip med kvitton (t.ex. Lunar) kan du välja CSV-filen <b>och</b> zip-filen samtidigt – kvittona kopplas då automatiskt till rätt rad via transaktions-ID.</p>
       <input type="file" id="imp-file" accept=".csv,.txt,.zip,text/csv,application/zip" multiple class="input" style="width:100%;margin-bottom:12px">
       <div id="imp-filinfo" class="note" style="margin:0 0 10px"></div>
       <textarea id="imp-paste" class="input" placeholder="…eller klistra in CSV-text här" style="width:100%;min-height:90px;font-family:'IBM Plex Mono',monospace;font-size:12px"></textarea>
       <div style="display:flex;gap:10px;margin-top:16px">
         <button class="btn ghost" id="imp-avbryt" style="flex:1">Avbryt</button>
         <button class="btn" id="imp-tolka" style="flex:1">Tolka →</button>
       </div>
     </div>
   </div></div>`;

  $("imp-close").onclick=close; $("imp-avbryt").onclick=close;
  $("impbg").onclick=e=>{ if(e.target.id==="impbg") close(); };

  async function lasFiler(){
    const files=Array.from($("imp-file").files||[]);
    let csvText=null; zipKvitton=[];
    for(const f of files){
      if(/\.zip$/i.test(f.name) || f.type==="application/zip" || f.type==="application/x-zip-compressed"){
        $("imp-filinfo").textContent="Packar upp "+f.name+"…";
        const z=await lasZip(f); zipKvitton=zipKvitton.concat(z.kvitton);
        if(!csvText && z.csv.length) csvText=z.csv[0].text;
      } else if(!csvText){
        csvText=decodeFile(await f.arrayBuffer());
      }
    }
    return csvText;
  }
  $("imp-tolka").onclick=async ()=>{
    try{
      const t=$("imp-paste").value;
      let text = t.trim() ? t : await lasFiler();
      if(!text){
        if(zipKvitton.length){ alert("Zip-filen innehöll ingen CSV. Välj bankens CSV-fil tillsammans med zip-filen."); return; }
        alert("Välj en fil eller klistra in CSV-text först."); return;
      }
      rows=parseCSVText(text); steg2();
    }catch(e){ alert(e.message||"Kunde inte läsa filen."); }
  };

  function guess(keys,names,not){ for(const n of names){ for(let i=0;i<keys.length;i++){ const h=keys[i].toLowerCase(); if(h.includes(n) && !(not||[]).some(x=>h.includes(x))) return i; } } return -1; }

  function steg2(){
    if(!rows.length){ alert("Hittade inga rader i filen."); return; }
    const maxCols=Math.max(...rows.map(r=>r.length));
    const headers=rows[0].map((h,i)=> (h&&h.trim())? h.trim() : "Kolumn "+(i+1));
    const hasHeader=rows[0].filter(c=>/\d/.test(c)).length<=1;
    const opts=(sel,tom)=>(tom?`<option value="-1" ${sel<0?"selected":""}>— ingen —</option>`:"")+headers.map((h,i)=>`<option value="${i}" ${i===sel?"selected":""}>${esc(h)}</option>`).join("");
    let gD=guess(headers,["bokföringsdag","bokf","datum","date"]); if(gD<0)gD=0;
    let gT=guess(headers,["titel","ytterligare detaljer","text","beskriv","namn","motpart","rubrik","narration","meddel","mottagare","info","referens"],["id"]); if(gT<0)gT=Math.min(1,maxCols-1);
    let gB=guess(headers,["belopp","amount","summa","transaktion"],["utländ","valuta","foreign","id"]); if(gB<0)gB=maxCols-1;
    let gI=guess(headers,["transaktions-id","transaktionsid","transaction id","id","löpnummer","arkiv"]);

    $("imp-body").innerHTML=`
      <p class="note" style="margin-top:0">${rows.length} rader hittades (inkl. ev. rubrikrad)${zipKvitton.length?` och ${zipKvitton.length} kvitton i zip-filen`:""}. Koppla kolumnerna till rätt fält.</p>
      <div class="form-grid">
        <div><label class="label">Datum</label><select class="select" id="map-d" style="width:100%">${opts(gD)}</select></div>
        <div><label class="label">Belopp</label><select class="select" id="map-b" style="width:100%">${opts(gB)}</select></div>
        <div><label class="label">Text / beskrivning</label><select class="select" id="map-t" style="width:100%">${opts(gT)}</select></div>
        <div><label class="label">Transaktions-ID (stoppar dubbletter${zipKvitton.length?", kopplar kvitton":""})</label><select class="select" id="map-i" style="width:100%">${opts(gI,true)}</select></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;cursor:pointer">
        <input type="checkbox" id="map-head" ${hasHeader?"checked":""}> Första raden är rubrik (hoppa över den)</label>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn ghost" id="imp-tillbaka" style="flex:1">← Tillbaka</button>
        <button class="btn" id="imp-granska" style="flex:1">Granska poster →</button>
      </div>`;
    $("imp-tillbaka").onclick=()=>openImport();
    $("imp-granska").onclick=()=>steg3(Number($("map-d").value),Number($("map-t").value),Number($("map-b").value),Number($("map-i").value),$("map-head").checked);
  }

  function steg3(di,ti,bi,ii,head){
    const data=head?rows.slice(1):rows;
    const historik=bankHistorik();
    const befIds=new Set(co().trans.filter(t=>t.bankId).map(t=>String(t.bankId).toLowerCase()));
    const befSig=new Set(co().trans.map(t=>t.datum+"|"+belopp(t).brutto.toFixed(2)+"|"+levNyckel(t.beskrivning)));
    const cands=data.map(r=>{
      const datum=parseDatum(r[di]); const bel=parseBelopp(r[bi]); const text=(r[ti]||"").trim();
      const bankId = ii>=0 ? String(r[ii]||"").trim() : "";
      const ok = datum!=null && !isNaN(bel) && bel!==0;
      const c={ datum, text, bel, bankId, ok };
      if(!ok) return c;
      const heltext=r.filter((_,i)=>i!==bi && i!==di).join("  ");
      Object.assign(c, bankForslag(text, bel, historik, heltext));
      const dublett = (bankId && befIds.has(bankId.toLowerCase())) || befSig.has(datum+"|"+Math.abs(bel).toFixed(2)+"|"+levNyckel(text));
      if(dublett){ c.inc=false; c.dublett=true; c.not="Finns redan i bokföringen"; }
      if(bankId) c.harKvitto=zipKvitton.some(k=>k.nyckel===bankId.toLowerCase());
      return c;
    });
    const giltiga=cands.filter(c=>c.ok);
    if(!giltiga.length){ alert("Kunde inte tolka datum/belopp. Kontrollera att rätt kolumner valts."); return; }

    const kontoOpts=(typ,konto)=>KONTON[typ].map(k=>`<option value="${k.konto}" ${k.konto===konto?"selected":""}>${k.konto} · ${esc(k.namn)}</option>`).join("");
    const momsSel=m=>`<select class="select imp-moms" style="padding:6px 8px;font-size:13px;width:66px">${[25,12,6,0].map(x=>`<option value="${x}" ${x===m?"selected":""}>${x}%</option>`).join("")}</select>`;
    const omvSel=o=>`<select class="select imp-omv" style="padding:6px 8px;font-size:13px;width:92px" title="Omvänd skattskyldighet">
        <option value="" ${!o?"selected":""}>Nej</option><option value="eu" ${o==="eu"?"selected":""}>EU</option><option value="ej-eu" ${o==="ej-eu"?"selected":""}>Utanför EU</option></select>`;

    let body="";
    cands.forEach((c,idx)=>{
      if(!c.ok) return;
      body+=`<tr data-row="${idx}" style="${c.inc?"":"opacity:.55"}">
        <td><input type="checkbox" class="imp-inc" ${c.inc?"checked":""}></td>
        <td class="num" style="font-size:12px;white-space:nowrap">${esc(c.datum)}</td>
        <td style="max-width:180px;font-size:13px;word-break:break-word">${esc(c.text||"—")}${c.harKvitto?' <span title="Kvitto finns i zip-filen" style="color:var(--green,#2f7a4f)">📎</span>':""}
          ${c.not?`<div class="konto" style="margin-top:3px">${esc(c.not)}</div>`:""}</td>
        <td class="r" style="font-weight:500;white-space:nowrap;${c.bel>0?"color:var(--green,#2f7a4f)":""}">${c.bel>0?"+":"−"}${esc(kr(Math.abs(c.bel)))}</td>
        <td><select class="select imp-typ" style="padding:6px 8px;font-size:13px">
          <option value="kostnad" ${c.typ==="kostnad"?"selected":""}>Kostnad</option><option value="intakt" ${c.typ==="intakt"?"selected":""}>Intäkt</option></select></td>
        <td><select class="select imp-konto" style="padding:6px 8px;font-size:13px;width:100%;min-width:150px;max-width:210px">${kontoOpts(c.typ,c.konto)}</select></td>
        <td>${momsSel(c.moms)}</td>
        <td>${omvSel(c.omvand)}</td></tr>`;
    });
    const nInc=giltiga.filter(c=>c.inc).length, nDub=giltiga.filter(c=>c.dublett).length, nHopp=giltiga.length-nInc-nDub;

    $("imp-body").innerHTML=`
      <p class="note" style="margin-top:0">${giltiga.length} rader tolkade: <b id="imp-antal">${nInc}</b> markerade för import${nHopp?`, ${nHopp} överföringar/uttag avmarkerade`:""}${nDub?`, ${nDub} finns redan`:""}.
        Förslagen bygger på tidigare bokföringar och kända leverantörer. Kontrollera konto och moms mot kvittot – särskilt <b>omvänd moms</b>, som bara gäller om säljaren inte tagit ut svensk moms.
        Ett positivt belopp från en leverantör bokförs som minskad kostnad (återbetalning).</p>
      <div style="overflow:auto;max-height:50vh;border:1px solid var(--line);border-radius:12px">
        <table class="tbl"><thead><tr>
          <th><input type="checkbox" id="imp-alla" title="Markera alla"></th><th>Datum</th><th>Text</th><th class="r">Belopp</th><th>Typ</th><th>Konto</th><th>Moms</th><th>Omvänd</th>
        </tr></thead><tbody id="imp-rows">${body}</tbody></table>
      </div>
      <div style="display:flex;gap:10px;margin-top:18px">
        <button class="btn ghost" id="imp-tillbaka2" style="flex:1">← Tillbaka</button>
        <button class="btn" id="imp-kor" style="flex:2">Importera valda poster</button>
      </div>`;

    const rakna=()=>{ $("imp-antal").textContent=document.querySelectorAll("#imp-rows .imp-inc:checked").length; };
    document.querySelectorAll("#imp-rows tr").forEach(tr=>{
      const ks=tr.querySelector(".imp-konto"), ms=tr.querySelector(".imp-moms"), ts=tr.querySelector(".imp-typ"), os=tr.querySelector(".imp-omv"), inc=tr.querySelector(".imp-inc");
      ks.onchange=()=>{ const k=KONTON[ts.value].find(x=>x.konto===ks.value); if(k) ms.value=k.moms; };
      ts.onchange=()=>{ ks.innerHTML=kontoOpts(ts.value, ts.value==="intakt"?"3001":"6991"); ks.onchange(); os.value=""; os.disabled=ts.value==="intakt"; };
      os.disabled=ts.value==="intakt";
      inc.onchange=()=>{ tr.style.opacity=inc.checked?"":".55"; rakna(); };
    });
    $("imp-alla").onchange=e=>{ document.querySelectorAll("#imp-rows tr").forEach(tr=>{ const c=cands[Number(tr.dataset.row)]; if(c.dublett) return;
      const inc=tr.querySelector(".imp-inc"); inc.checked=e.target.checked; tr.style.opacity=inc.checked?"":".55"; }); rakna(); };
    $("imp-tillbaka2").onclick=()=>steg2();
    $("imp-kor").onclick=async ()=>{
      let n=0;
      // Verifikationsnummer ska löpa i datumordning. Banker listar ofta nyast först –
      // vänd i så fall ordningen så att samma dag behåller rätt inbördes ordning.
      let valda=Array.from(document.querySelectorAll("#imp-rows tr")).filter(tr=>tr.querySelector(".imp-inc").checked);
      const gd=giltiga.map(c=>c.datum);
      if(gd.length>1 && gd[0]>gd[gd.length-1]) valda.reverse();
      valda=valda.map((tr,i)=>({tr,i})).sort((a,b)=>{ const da=cands[Number(a.tr.dataset.row)].datum, db=cands[Number(b.tr.dataset.row)].datum; return da<db?-1:da>db?1:a.i-b.i; }).map(x=>x.tr);
      valda.forEach(tr=>{
        const c=cands[Number(tr.dataset.row)];
        const typ=tr.querySelector(".imp-typ").value;
        const konto=tr.querySelector(".imp-konto").value;
        const kObj=KONTON[typ].find(k=>k.konto===konto)||{namn:konto};
        const omv=typ==="kostnad"?tr.querySelector(".imp-omv").value:"";
        // Kostnad: uttag = positiv kostnad, insättning (återbetalning) = negativ kostnad. Intäkt: tvärtom.
        const signerat = typ==="kostnad" ? -c.bel : c.bel;
        const t={
          id:"imp"+Date.now()+"_"+(n)+"_"+Math.floor(Math.random()*1e6),
          ver:co().nextVer++, datum:c.datum, typ,
          konto, kontoNamn:kObj.namn, beskrivning:c.text,
          beloppInput:Math.round(signerat*100)/100, inklMoms:!omv, momssats:Number(tr.querySelector(".imp-moms").value),
        };
        if(omv) t.omvand=omv;
        if(c.bankId) t.bankId=c.bankId;
        co().trans.push(t);
        n++;
      });
      let kvInfo="";
      if(zipKvitton.length){
        $("imp-body").innerHTML=`<p class="note" id="imp-status">Kopplar kvitton…</p>`;
        const res=await kopplaZipKvitton(zipKvitton, msg=>{ const el=$("imp-status"); if(el) el.textContent=msg; });
        const ej=res.ejMatchade.filter(k=>k.nyckel);
        kvInfo=`\n${res.kopplade} kvitton från zip-filen kopplades.`+(ej.length?`\n${ej.length} kvitton hörde till rader som inte importerades.`:"");
      }
      save(); close(); state.vy="verifikationer"; render();
      alert(n+" poster importerades."+kvInfo);
    };
  }
}

/* ============================================================ */
/*  Säkerhetskopiering + GitHub-synk                           */
/* ============================================================ */
function validBackup(d){ return d && d.app==="ef-bokforing" && (Array.isArray(d.companies) || Array.isArray(d.trans)); }
function antalPoster(d){
  if(Array.isArray(d.companies)) return d.companies.reduce((n,c)=>n+(Array.isArray(c.trans)?c.trans.length:0),0);
  return Array.isArray(d.trans)?d.trans.length:0;
}

async function buildBackupData(){
  let kvitton={};
  try{
    const kv=await Kvitton.all();
    kv.forEach(r=>{ if(r&&r.id) kvitton[r.id]={ name:r.name, type:r.type, dataUrl:r.dataUrl }; });
  }catch(e){ console.warn("Kunde inte läsa kvitton", e); }
  return { app:"ef-bokforing", version:2, exportedAt:new Date().toISOString(),
    companies:state.companies, activeId:state.activeId, kvitton };
}

async function applyBackup(data){
  try{ await Kvitton.clear(); }catch(e){}
  if(data.kvitton){ for(const id of Object.keys(data.kvitton)){ const r=data.kvitton[id];
    try{ await Kvitton.put({ id, name:r.name, type:r.type, dataUrl:r.dataUrl }); }catch(e){ console.warn("Kvitto kunde inte återställas", id); } } }
  if(Array.isArray(data.companies) && data.companies.length){
    state.companies=data.companies; state.activeId=data.activeId||data.companies[0].id;
  } else { // gammalt format
    const c=tomtForetag((data.settings&&data.settings.firma)||"Min Enskilda Firma");
    if(data.settings){ c.orgnr=data.settings.orgnr||""; c.nextVer=data.settings.nextVer||1; }
    c.trans=Array.isArray(data.trans)?data.trans:[];
    state.companies=[c]; state.activeId=c.id;
  }
  if(!co()) state.activeId=state.companies[0].id;
  state.companies.forEach(normCompany);
  save(); render();
}

async function exportBackup(){
  const data=await buildBackupData();
  const blob=new Blob([JSON.stringify(data)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`bokforing-backup-${idag()}.json`; a.click();
  URL.revokeObjectURL(url);
}

function importBackup(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=async ()=>{
      let data;
      try{ data=JSON.parse(fr.result); }catch(e){ alert("Filen kunde inte läsas som en giltig säkerhetskopia."); return; }
      if(!validBackup(data)){ alert("Det här ser inte ut som en säkerhetskopia från appen."); return; }
      const antalK=data.kvitton?Object.keys(data.kvitton).length:0;
      if(!confirm(`Återställ ${antalPoster(data)} verifikationer och ${antalK} kvitton?\n\nDetta ERSÄTTER all data som finns i appen just nu.`)) return;
      await applyBackup(data);
      document.getElementById("modal").innerHTML="";
      alert("Säkerhetskopian har återställts.");
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ---- GitHub (en fil per företag) ---- */
const GH_KEY="ef-github";
var _ghTimer=null;
function ghCfg(){ try{ return JSON.parse(localStorage.getItem(GH_KEY))||{}; }catch(e){ return {}; } }
function ghSaveCfg(c){ try{ localStorage.setItem(GH_KEY, JSON.stringify(c)); }catch(e){} }
function utf8ToB64(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64ToUtf8(b){ return decodeURIComponent(escape(atob(String(b).replace(/\s/g,"")))); }

function ghHeaders(extra){
  const c=ghCfg();
  return Object.assign({ "Authorization":"Bearer "+c.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" }, extra||{});
}
function ghEncPath(p){ return String(p).split("/").filter(x=>x!=="").map(encodeURIComponent).join("/"); }
function ghFolder(){ return (ghCfg().folder||"").trim().replace(/^\/+|\/+$/g,""); }
function ghCompanyPath(company){ const f=ghFolder(); return (f?f+"/":"")+company.id+".json"; }

async function ghGet(path){
  const c=ghCfg();
  const res=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${ghEncPath(path)}?ref=${encodeURIComponent(c.branch||"main")}`, { headers:ghHeaders() });
  if(res.status===404) return { exists:false };
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.message||("GitHub-fel "+res.status)); }
  const j=await res.json();
  if(Array.isArray(j)) return { exists:true, dir:true, entries:j };
  // Filer över 1 MB skickas utan innehåll i JSON-svaret – hämta dem som rådata i stället
  if(j.encoding!=="base64" || !j.content){
    const raw=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${ghEncPath(path)}?ref=${encodeURIComponent(c.branch||"main")}`,
      { headers:ghHeaders({ "Accept":"application/vnd.github.raw+json" }) });
    if(!raw.ok) throw new Error("Kunde inte hämta "+path+" (GitHub-fel "+raw.status+")");
    return { exists:true, sha:j.sha, content:await raw.text() };
  }
  return { exists:true, sha:j.sha, content:b64ToUtf8(j.content) };
}
async function ghPut(path, str, message){
  const c=ghCfg();
  let sha=null;
  try{ const cur=await ghGet(path); if(cur.exists && !cur.dir) sha=cur.sha; }catch(e){ /* nytt repo/fil */ }
  const res=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${ghEncPath(path)}`, {
    method:"PUT", headers:ghHeaders({ "Content-Type":"application/json" }),
    body:JSON.stringify({ message, content:utf8ToB64(str), sha:sha||undefined, branch:c.branch||"main" })
  });
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.message||("GitHub-fel "+res.status)); }
}

async function buildCompanyData(company){
  let kvitton={};
  try{
    const all=await Kvitton.all();
    const ids=new Set(company.trans.map(t=>String(t.id)));
    all.forEach(r=>{ if(r&&r.id&&ids.has(kvittoBasId(r.id))) kvitton[r.id]={ name:r.name, type:r.type, dataUrl:r.dataUrl }; });
  }catch(e){ console.warn("Kunde inte läsa kvitton", e); }
  return { app:"ef-bokforing-company", version:1, exportedAt:new Date().toISOString(), company, kvitton };
}
async function applyCompanyData(data){
  if(!data || data.app!=="ef-bokforing-company" || !data.company || !data.company.id) throw new Error("Ogiltig företagsfil.");
  if(data.kvitton){ for(const id of Object.keys(data.kvitton)){ const r=data.kvitton[id];
    try{ await Kvitton.put({ id, name:r.name, type:r.type, dataUrl:r.dataUrl }); }catch(e){} } }
  const comp=Object.assign({ orgnr:"", nextVer:1, trans:[] }, data.company);
  normCompany(comp);
  const i=state.companies.findIndex(c=>c.id===comp.id);
  if(i>=0) state.companies[i]=comp; else state.companies.push(comp);
  if(!state.activeId || !co()) state.activeId=state.companies[0].id;
}

async function ghPushCompany(company, status){
  if(status) status("Sparar "+company.firma+"…");
  const data=await buildCompanyData(company);
  await ghPut(ghCompanyPath(company), JSON.stringify(data), "Uppdatera "+company.firma+" "+new Date().toISOString());
}
async function ghPush(status){ // aktivt företag
  const c=ghCfg(); if(!c.owner||!c.repo||!c.token){ (status||alert)("Fyll i repo och token först."); return; }
  try{ await ghPushCompany(co(), status); if(status) status("Sparat ✓ "+new Date().toLocaleTimeString("sv-SE")); }
  catch(err){ if(status) status("Fel: "+err.message); else alert("Fel: "+err.message); }
}
async function ghPushAll(status){ // alla företag
  const c=ghCfg(); if(!c.owner||!c.repo||!c.token){ (status||alert)("Fyll i repo och token först."); return; }
  try{ for(const comp of state.companies) await ghPushCompany(comp, status);
    if(status) status("Alla företag sparade ✓ "+new Date().toLocaleTimeString("sv-SE")); }
  catch(err){ if(status) status("Fel: "+err.message); else alert("Fel: "+err.message); }
}
async function ghPull(status){
  const c=ghCfg(); if(!c.owner||!c.repo||!c.token){ (status||alert)("Fyll i repo och token först."); return; }
  if(status) status("Hämtar från GitHub…");
  try{
    const listing=await ghGet(ghFolder());
    let files=[];
    if(listing.exists && listing.dir) files=listing.entries.filter(e=>e.type==="file" && /\.json$/i.test(e.name));
    if(!files.length){ if(status) status("Inga företagsfiler hittades i repot."); return; }
    if(!confirm(`Hämta upp till ${files.length} företagsfil(er) från GitHub?\n\nFöretag med samma id ersätts av versionen i repot. Övriga företag i appen lämnas orörda.`)){ if(status) status(""); return; }
    let n=0;
    for(const fe of files){
      let got; try{ got=await ghGet(fe.path); }catch(e){ continue; }
      if(!got.exists || got.dir) continue;
      let data; try{ data=JSON.parse(got.content); }catch(e){ continue; }
      if(data && data.app==="ef-bokforing-company"){ await applyCompanyData(data); n++; }
    }
    save(); render();
    if(status) status(n+" företag hämtade ✓");
  }catch(err){ if(status) status("Fel: "+err.message); else alert("Fel: "+err.message); }
}
function scheduleGhPush(){
  const c=ghCfg(); if(!c.auto||!c.owner||!c.repo||!c.token) return;
  clearTimeout(_ghTimer);
  _ghTimer=setTimeout(()=>ghPush(msg=>{ const el=document.getElementById("i-gh-status"); if(el) el.textContent=msg; }), 4000);
}

load();
render();
